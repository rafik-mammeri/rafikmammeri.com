[tasks.dev]
description = "Run the local dev server with live reload"
run = "uv run zensical serve"

[tasks.build]
description = "Build the static site into site/"
run = "uv run zensical build --clean"

[tasks."preview-build"]
description = "Build, then serve the exact static output (what GitHub Pages will deploy)"
depends = ["build"]
run = "uv run python -m http.server 8080 --directory site"

[tasks.feed]
description = "Regenerate docs/feed.xml from the articles in docs/writing/"
run = "uv run python scripts/gen_feed.py"

[tasks.clean]
description = "Remove build output and Zensical cache"
run = "rm -rf site .cache"

[tasks.deploy]
description = "Verify the build locally, push to trigger the live deploy, and watch it through to completion"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -n "$(git status --porcelain)" ]; then
  echo "You have uncommitted changes — commit them first, or they won't be part of this deploy:" >&2
  git status --short
  exit 1
fi

git push origin HEAD
export SHA=$(git rev-parse HEAD)
echo "Pushed $SHA — waiting for GitHub Actions to pick it up..."

run_id=""
for i in $(seq 1 30); do
  run_id=$(gh run list --workflow=docs.yml --limit 5 --json databaseId,headSha --jq '.[] | select(.headSha==env.SHA) | .databaseId' | head -1)
  if [ -n "$run_id" ]; then break; fi
  sleep 2
done

if [ -z "$run_id" ]; then
  echo "Could not find the triggered workflow run — check https://github.com/rafik-mammeri/rafikmammeri.com/actions" >&2
  exit 1
fi

gh run watch "$run_id" --exit-status

if gh api -X PUT repos/rafik-mammeri/rafikmammeri.com/pages -F https_enforced=true >/dev/null 2>&1; then
  echo "Live at https://www.rafikmammeri.com"
else
  echo "Live at http://www.rafikmammeri.com (HTTPS cert still provisioning on GitHub's side — will switch automatically once ready)"
fi
'''
