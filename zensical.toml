[project]
site_url = "https://www.rafikmammeri.com/"
site_name = "Rafik Mammeri"
site_description = "Senior AI Engineer — agentic systems and LLM infrastructure in production"
site_author = "Rafik Mammeri"

nav = [
  { "Home" = "index.md" },
  { "Projects" = "projects.md" },
  { "Writing" = "writing/index.md" },
  { "Experience" = "experience.md" },
  { "Contact" = "contact.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.top",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.indexes",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.footnote.tooltips",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:rafik@rafikmammeri.com"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/rafikmammeri"

[project.markdown_extensions]
abbr = {}
attr_list = {}
def_list = {}
md_in_html = {}
admonition = {}
footnotes = {}
tables = {}
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.snippets = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
