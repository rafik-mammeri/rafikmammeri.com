[project]
site_url = "https://www.rafikmammeri.com/"
site_name = "Rafik Mammeri"
site_description = "Lead AI Engineer. Tech lead of a team of AI engineers shipping AI agents to production at scale."
site_author = "Rafik Mammeri"
copyright = "&copy; 2026 Rafik Mammeri"

nav = [
  { "Home" = "index.md" },
  { "Experience" = "experience.md" },
  { "Articles" = "articles.md" },
  { "About" = "about.md" },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/language-switch.js", "javascripts/attention.js", "javascripts/theme-lamp.js", "javascripts/articles.js", "javascripts/experience.js"]


[project.extra]
generator = false
# Both languages share stored preferences (light/dark theme), so switching language keeps the theme
scope = "/"
alternate = [
  { name = "English", link = "/", lang = "en" },
  { name = "Français", link = "/fr/", lang = "fr" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.svg"
logo = "assets/logo.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "header.autohide",
  "navigation.indexes",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.footnote.tooltips",
]

[project.theme.icon]
alternate = "lucide/languages"
repo = "fontawesome/brands/github"
admonition.tip = "lucide/lightbulb"
admonition.note = "lucide/shield-check"

[project.theme.font]
text = "Urbanist"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "rm/mode-light"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "rm/mode-dark"
toggle.name = "Light mode"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:rafik@rafikmammeri.com"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/rafikmammeri"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rafik-mammeri"

[[project.extra.social]]
icon = "fontawesome/brands/medium"
link = "https://medium.com/@rafik_23044"

[[project.extra.social]]
icon = "fontawesome/brands/dev"
link = "https://dev.to/rafik_mammeri"

# Where readers can follow new articles (article pages, right column). Add entries here,
# for example Medium: icon = "fontawesome/brands/medium", link = "https://medium.com/@…", color = "#000000"
[[project.extra.follow]]
name = "LinkedIn"
icon = "fontawesome/brands/linkedin-in"
link = "https://www.linkedin.com/in/rafikmammeri"
color = "#0A66C2"

[[project.extra.follow]]
name = "RSS"
icon = "fontawesome/solid/rss"
link = "/feed.xml"
color = "#F26522"

[project.markdown_extensions]
abbr = {}
attr_list = {}
def_list = {}
md_in_html = {}
admonition = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.snippets = {}
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
  options = { custom_icons = ["overrides/.icons"] },
}
